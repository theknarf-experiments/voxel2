[workspace]
resolver = "2"
members = ["crates/*", "demos/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# External
# TODO: slim to explicit feature list once the needed set stabilizes.
# `reflect_documentation` is what makes the doc comments on `LevelDef` and
# the host's planning schema reachable at runtime — the editor reads field
# labels and tooltips off `NamedField::docs()` rather than restating them.
# It is NOT a bevy default feature.
bevy = { version = "0.19", features = [
    "free_camera",
    "bevy_remote",
    "bevy_dev_tools",
    "bevy_feathers",
    "reflect_documentation",
] }
glam = { version = "0.32", features = ["serde"] }  # keep in sync with bevy's glam version
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
lz4_flex = "0.11"
ahash = "0.8"
crossbeam-channel = "0.5"
serde_json = "1"
naga = { version = "29", features = ["wgsl-in"] }

# Internal
bevy_graph_view = { path = "crates/bevy_graph_view" }
voxel-core = { path = "crates/voxel-core" }
voxel-layers = { path = "crates/voxel-layers" }
voxel-worldgen = { path = "crates/voxel-worldgen" }
voxel-render = { path = "crates/voxel-render" }
voxel-engine = { path = "crates/voxel-engine" }
voxel-debug = { path = "crates/voxel-debug" }
voxel-editor = { path = "crates/voxel-editor" }

# Fast iterative builds: light opt for our code, full opt for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
